        - heading "DELETION AND OPT OUT OF SALE OF PERSONAL INFORMATION" [level=1] [ref=f24e6]
        - generic [ref=f24e7]: Submit this form with your information to request opt-out and deletion from MyLife.com. Requests are processed within the legally required time frames. Any profile listing published on our website that matches your information, will be permanently removed. The information you provide is to make sure MyLife removes the correct record(s), particularly if there are multiple profiles or records under the same name or a similar name. For additional support, contact MyLife Customer Care at membersupport@mylife.com
