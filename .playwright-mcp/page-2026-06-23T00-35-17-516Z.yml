        - generic [ref=f24e11]: Residents of some U.S. states, including California, Colorado, Connecticut, Delaware, Iowa, Montana, Nebraska, New Hampshire, New Jersey, Oregon, Texas, Utah, and Virginia (and other states as new laws become effective) provide their consumers with rights to "opt out" of sale of their personal information and/or to "delete" that information from company databases. We provide these options to residents of these states and (at our discretion) residents of other states as well.
