          - paragraph [ref=e347]: The inmate needs the support of family and friends during arrest, while in prison, and after being released. While it might not look like a big deal, many might be afraid of the ongoing case. So, being a close friend or family member, you need to be very supportive of the situation. Below are a few ways you can help the inmate.
